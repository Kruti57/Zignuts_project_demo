{% extends 'base.html' %}
{% load static %}

{% block title %}Page Not Found (404) - SyncMind AI{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
  <div class="col-12 col-md-6 text-center animate-fade-up">
    <div class="rounded-circle bg-primary-subtle text-primary p-4 d-inline-flex mb-3">
      <i class="bi bi-compass fs-1"></i>
    </div>
    <h1 class="fw-bold display-4 brand-gradient-text">404</h1>
    <h4 class="fw-bold mb-2">Page Not Found</h4>
    <p class="text-muted small mb-4">The meeting notes or resource you are looking for might have been moved or removed.</p>
    <a href="{% url 'dashboard' %}" class="btn btn-primary-gradient px-4">
      <i class="bi bi-house-door me-1"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
