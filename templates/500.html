{% extends 'base.html' %}
{% load static %}

{% block title %}Server Error (500) - SyncMind AI{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
  <div class="col-12 col-md-6 text-center animate-fade-up">
    <div class="rounded-circle bg-danger-subtle text-danger p-4 d-inline-flex mb-3">
      <i class="bi bi-shield-exclamation fs-1"></i>
    </div>
    <h1 class="fw-bold display-4 text-danger">500</h1>
    <h4 class="fw-bold mb-2">Unexpected Server Error</h4>
    <p class="text-muted small mb-4">An error occurred while processing your request. Please try again or return to dashboard.</p>
    <a href="{% url 'dashboard' %}" class="btn btn-primary-gradient px-4">
      <i class="bi bi-house-door me-1"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
